{% extends 'base.html' %}
{% block content %}
<style>
    body {
        font-family: 'Times New Roman';
        font-size: 22px;
        text-align: center;
        color: black;
        line-height: 1.8;
    }
</style>

<h2>Refugee Registration Form</h2>

<form method="POST" action="{{ url_for('submit_form') }}">
    <label for="name">Name: </label>
    <input type="text" id="name" name="name" placeholder="Full name" required><br>
    <label for="country">Country of Origin: </label>
    <input type="text" id="country" name="country" placeholder="Country of origin" required pattern="[A-Za-z/s]" title="Needs to be the name of a country."><br>
    <label for="age">Age: </label>
    <input type="number" id="age" name="age" placeholder="Age" required><br>
    <label for="gender">Gender: </label>

<label class="container">
<input type="radio" name="gender" value="female" required>
Female
</label>
<label class="container">
<input type="radio" name="gender" value="male" required>
Male
</label><br>
<label for="dob">Date of Birth: </label>
<input type="text" id="dob" name="date_of_birth" placeholder="DD/MM/YY" required><br>
  
 <p><button type="submit">Submit</button></p>
</form>
{% endblock %}
