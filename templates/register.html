{% extends 'base.html' %}
{% block content %}
<h2>Refugee Registration Form</h2>

<form method="POST" action="{{ url_for('submit_form') }}">
    <label for="first_name"> First Name: </label>
    <input type="text" id="first_name" name="first_name" placeholder="First name" required><br>
    <label for="last_name"> Last Name: </label>
    <input type="text" id="last_name" name="last_name" placeholder="Last name" required><br>
    <label for="country">Country of Origin: </label>
    <input type="text" id="country" name="country" placeholder="Country of origin" required pattern="[A-Za-z/s]" title="Needs to be the name of a country."><br>
    <label for="age">Age: </label>
    <input type="number" id="age" name="age" placeholder="Age" required><br>
    <label for="nationality">Nationality: </label>
    <input type="text" id="nationality" name="nationality" placeholder="Nationality" required><br>
    <label for="medical_information">Medical Information: </label>
    <input type="text" id="medical_information" name="medical_information" placeholder="Medical Information" required><br>
    <label for="family_information">Family Information: </label>
    <input type="text" id="family_information" name="family_information" placeholder="Family Information" required><br>
    <label for="skills">Skills Information: </label>
    <input type="text" id="skills" name="skills" placeholder="Skills Information" required><br>
    <label for="email">Email: </label>
    <input type="text" id="email" name="email" placeholder="mail@example.com" required><br>
    <label for="phone">Phone: </label>
    <input type="text" id="phone" name="phone" placeholder="Phone" required><br>
    <label for="gender">Gender: </label>

<label class="container">
<input type="radio" name="gender" value="female" required>
Female
</label>
<label class="container">
<input type="radio" name="gender" value="male" required>
Male
</label><br>
<label for="dob">Date of Birth: </label>
<input type="text" id="dob" name="date_of_birth" placeholder="DD/MM/YY" required><br>
  
 <p><button class="submit-btn" type="submit">Submit</button></p>

</form>
{% endblock %}
